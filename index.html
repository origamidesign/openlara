<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tomb Raider 1 — OpenLara</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="arcade.css?v=8">
</head>
<body>
<canvas id="canvas" class="game" width="640" height="480" tabindex="0" aria-label="Tomb Raider 1" oncontextmenu="event.preventDefault()"></canvas>
<header>
  <div id="titleLogo" hidden><img src="assets/origami-design.png" alt="Origami Design" draggable="false"></div>
  <button id="menuToggle" type="button" aria-label="Ouvrir le menu des niveaux" aria-controls="arcadeMenu" aria-expanded="false" title="Menu des niveaux">☰</button>
  <section id="arcadeMenu" aria-label="Menu des niveaux" hidden>
    <div class="menu-heading"><strong>Tomb Raider 1</strong><button id="menuClose" type="button" aria-label="Fermer le menu">×</button></div>
    <label for="levelSelect">Choisir un niveau</label>
    <select id="levelSelect"></select>
    <button id="loadLevel" type="button" disabled>Jouer à ce niveau</button>
    <button id="goFS" type="button">Plein écran</button>
    <p>Cliquer dans le jeu pour activer le clavier et le son. Les commandes se règlent dans les options du jeu.</p>
    <div id="info"><a href="https://github.com/XProger/OpenLara" target="_blank" rel="noopener noreferrer">OpenLara — XProger</a></div>
  </section>
</header>
<div id="status" role="status">Chargement…</div>
<script>
				var statusElement = document.getElementById('status');
				var canvasElement = document.getElementById('canvas');
				var proc;

				function fullscreen() {
    var root = document.documentElement;
    var action = document.fullscreenElement ? document.exitFullscreen && document.exitFullscreen() : root.requestFullscreen && root.requestFullscreen();
    if (action && action.catch) action.catch(function () { Module.setStatus('Plein écran indisponible dans ce navigateur.'); });
    canvasElement.focus();
}

				var goFS = document.getElementById("goFS");
				
				goFS.addEventListener("click", function() { fullscreen(canvasElement); }, false);

				window.onload = function() { window.focus(); }
				
				var Module = {
					TOTAL_MEMORY: 192*1024*1024,
					preRun: [],
					postRun: [function () {
    document.getElementById('loadLevel').disabled = false;
    Module.setStatus('');
}],
					print: (function() {
								return function(text) {
									if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
									console.log(text);
								};
							})(),
					printErr: function(text) {
						if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
						if (0) {
							dump(text + '\n');
						} else {
							console.error(text);
						}
					},
					canvas: (function() {
						canvasElement.addEventListener("webglcontextlost", function(e) { alert('WebGL context lost. You will need to reload the page.'); e.preventDefault(); }, false);
						return canvasElement;
					})(),
					setStatus: function(text) {
						if (!Module.setStatus.last) Module.setStatus.last = { time: Date.now(), text: '' };
						if (text === Module.setStatus.text) return;
						statusElement.textContent = text;
                        statusElement.hidden = !text;
					},
					totalDependencies: 0,
					monitorRunDependencies: function(left) {
						this.totalDependencies = Math.max(this.totalDependencies, left);
						Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies-left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
					},
				};

				var audioContext = null;

				function snd_init() {
					var AudioContext = window.AudioContext || window.webkitAudioContext;
					if (!AudioContext) return;
					audioContext = new (window.AudioContext || window.webkitAudioContext)();
					var count  = 4096;
					var rate   = 44100 / audioContext.sampleRate;
					var framesCount = Math.ceil(count * rate);
					var frames = Module._malloc(framesCount * 4); // interleaved short L, R
					proc = audioContext.createScriptProcessor(count, 2, 2);
					proc.onaudioprocess = function(e) {
						var L = e.outputBuffer.getChannelData(0),
							R = e.outputBuffer.getChannelData(1);
						Module.ccall('snd_fill', 'null', ['number', 'number'], [frames, framesCount]);
						for (var i = 0; i < count; i++) {
							var index = frames + Math.floor(i * rate) * 4; // 4 is sample frame stride in bytes
							L[i] = Module.getValue(index    , 'i16') / 0x8000;
							R[i] = Module.getValue(index + 2, 'i16') / 0x8000;
						}
					}
					proc.connect(audioContext.destination);
				}

				function getLanguage() {
					var lang = navigator.languages && navigator.languages[0] || navigator.language || navigator.userLanguage;
					if (!lang) return;
					var id = 0;
					lang = lang.substring(0, 2);
					if (lang == "fr") {
						id = 1;
					} else if (lang == "de") {
						id = 2;
					} else if (lang == "es") {
						id = 3;
					} else if (lang == "it") {
						id = 4;
					} else if (lang == "pl") {
						id = 5;
					} else if (lang == "pt") {
						id = 6;
					} else if (lang == "ru" || lang == "be" || lang == "uk") {
						id = 7;
					} else if (lang == "ja") {
						id = 8;
					} else if (lang == "gr") {
						id = 9;
					} else if (lang == "fi") {
                        id = 10;
                    } else if (lang == "cs") {
                        id = 11;
                    } else if (lang == "zh") {
                        id = 12;
                    } else if (lang == "hu") {
                        id = 13;
                    } else if (lang == "sv") {
                        id = 14;
                    }
					Module.ccall('set_def_lang', 'null', ['number'], [id]);
				}

			// unlock audio context after user interaction
				var userAction = function() {
					if (audioContext && audioContext.state == "suspended") {
						audioContext.resume().then(function() {
							window.removeEventListener('touchstart', userAction, false);
							window.removeEventListener('click', userAction, false);
							console.log("resume playback");
						});
					}
				};
				window.addEventListener('touchstart', userAction, false);
				window.addEventListener('click', userAction, false);

				Module.setStatus('Downloading...');
				window.onerror = function(event) {
					Module.setStatus('Exception thrown, see JavaScript console');
					//spinnerElement.style.display = 'none';
					statusElement.hidden = false;
					Module.setStatus = function(text) {
						if (text) Module.printErr('[post-exception status] ' + text);
					};
				};
			</script>
<script src="arcade.js?v=7"></script>
<script src="lanceur.js?v=6"></script>
<script src="OpenLara_wasm.js?v=5"></script>
</body>
</html>
